; /etc/php-fpm.d/lab01.conf
[lab01]
user = lab01
group = lab01
listen = /run/php-fpm/lab01.sock
listen.owner = apache
listen.group = lab01
listen.mode = 0660

; Process Manager Configuration (Mandatory for PHP-FPM pools)
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Directory & Security Boundaries
php_admin_value[open_basedir] = /srv/labs/lab01:/tmp
php_admin_value[session.save_path] = /srv/labs/lab01/sessions

; Lab 01 Specific Deliberate Misconfigurations
php_admin_value[allow_url_include] = On
php_admin_value[allow_url_fopen] = On
php_admin_value[disable_functions] =

; Resource Limits & Display Errors
php_flag[display_errors] = On
php_flag[display_startup_errors] = On
php_admin_value[max_execution_time] = 30
php_admin_value[memory_limit] = 128M
