; /etc/php-fpm.d/lab01.conf
[lab01]
user = lab01
group = lab01
listen = /run/php-fpm/lab01.sock
listen.owner = apache
listen.group = lab01
listen.mode = 0660

; Process Manager Configuration
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Directory & Security Boundaries
php_admin_value[open_basedir] = /srv/labs/lab01:/etc/lab01.conf:/tmp
php_admin_value[session.save_path] = /srv/labs/lab01/sessions

; Lab 01 Deliberate Misconfiguration (required for RFI teaching objective)
php_admin_value[allow_url_include] = On
php_admin_value[allow_url_fopen] = On

; Defense-in-depth: disable dangerous shell execution functions
; proc_open is allowed (used safely with array-form in network_diagnostics.php)
php_admin_value[disable_functions] = shell_exec,exec,system,passthru,popen,pcntl_exec

; Production-appropriate error handling
php_flag[display_errors] = Off
php_flag[display_startup_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[error_log] = /var/log/php-fpm/lab01_errors.log

; Resource Limits
php_admin_value[max_execution_time] = 15
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 10M
