# /etc/systemd/system/httpd.service.d/lab01-limits.conf
# Resource limits to prevent DoS via fork bombs, disk-fill, or memory exhaustion
[Service]
MemoryMax=512M
MemoryHigh=384M
CPUQuota=50%
LimitNPROC=512
LimitFSIZE=104857600
Restart=always
RestartSec=5
TimeoutStopSec=10

# Bind mount uploads as tmpfs to limit disk-fill impact
# TemporaryFileSystem=/srv/labs/lab01/uploads:size=50M
