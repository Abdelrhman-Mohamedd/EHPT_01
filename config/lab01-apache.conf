# Apache VirtualHost configuration for Lab 01 - NexaCorp Employee Portal

# Ensure Apache listens on port 8081
Listen 8081

<VirtualHost *:8081>
    ServerName employeeportal.local
    DocumentRoot /srv/labs/lab01/public

    # Public web root access
    <Directory /srv/labs/lab01/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Public uploads directory (Intentionally kept inside DocumentRoot for RCE validation)
    <Directory /srv/labs/lab01/public/uploads>
        Options +FollowSymLinks
        Require all granted
    </Directory>

    # Defense-in-Depth: Explicitly deny web access to data/ directory if DocumentRoot is misconfigured
    <Directory /srv/labs/lab01/data>
        Require all denied
    </Directory>

    # Pass all PHP scripts to dedicated lab01 PHP-FPM pool socket
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/lab01.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog /var/log/httpd/lab01_error.log
    CustomLog /var/log/httpd/lab01_access.log combined
</VirtualHost>
