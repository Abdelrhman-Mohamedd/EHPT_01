# Apache VirtualHost configuration for Lab 01 - NexaCorp Employee Portal

Listen 8081

<VirtualHost *:8081>
    ServerName employeeportal.local
    DocumentRoot /srv/labs/lab01/public

    # Public web root access
    <Directory /srv/labs/lab01/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Deny all web access to legacy public/uploads path
    # Uploads are now stored outside webroot at /srv/labs/lab01/uploads/
    <Directory /srv/labs/lab01/public/uploads>
        Require all denied
    </Directory>

    # Deny web access to data/ directory
    <Directory /srv/labs/lab01/data>
        Require all denied
    </Directory>

    # Deny web access to new uploads directory (outside webroot, defense-in-depth)
    <Directory /srv/labs/lab01/uploads>
        Require all denied
    </Directory>

    # Pass PHP scripts to dedicated lab01 PHP-FPM pool socket
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/lab01.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog /var/log/httpd/lab01_error.log
    CustomLog /var/log/httpd/lab01_access.log combined
</VirtualHost>
